<<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - 用户登录</title>
    <!-- 引入外部CSS样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- 左侧图片区域 -->
        <div class="login-image">
            <div class="logo">优品</div>
            <h2>欢迎来到优品商城</h2>
            <p>发现优质好物，享受便捷购物体验<br>新用户注册即享专属优惠</p>
        </div>

        <!-- 右侧表单区域 -->
        <div class="login-form">
            <div class="form-header">
                <h1>用户登录</h1>
                <p>登录您的账户，开始购物之旅</p>
            </div>

            <!-- 表单切换标签 -->
            <div class="form-tabs">
                <button class="tab-btn active" data-form="login">登录</button>
                <button class="tab-btn" data-form="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <div class="form-content active" id="login-form">
                <div class="form-group">
                    <label for="login-email">邮箱/手机号</label>
                    <input type="text" id="login-email" placeholder="请输入邮箱或手机号">
                    <div class="error-message">请输入有效的邮箱或手机号</div>
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码">
                    <div class="error-message">密码不能为空</div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> 记住我
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <button class="submit-btn" id="login-submit">登录</button>

                <div class="divider">
                    <span>或使用以下方式登录</span>
                </div>

                <div class="social-login">
                    <div class="social-btn wechat">
                        <span>微</span>
                    </div>
                    <div class="social-btn qq">
                        <span>Q</span>
                    </div>
                    <div class="social-btn weibo">
                        <span>微</span>
                    </div>
                </div>
            </div>

            <!-- 注册表单 -->
            <div class="form-content" id="register-form">
                <div class="form-group">
                    <label for="register-name">用户名</label>
                    <input type="text" id="register-name" placeholder="请输入用户名">
                    <div class="error-message">用户名不能为空</div>
                </div>

                <div class="form-group">
                    <label for="register-email">邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入邮箱">
                    <div class="error-message">请输入有效的邮箱地址</div>
                </div>

                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码（至少6位）">
                    <div class="error-message">密码长度不能少于6位</div>
                </div>

                <div class="form-group">
                    <label for="register-confirm">确认密码</label>
                    <input type="password" id="register-confirm" placeholder="请再次输入密码">
                    <div class="error-message">两次输入的密码不一致</div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required> 我已阅读并同意<a href="#" style="color: #165DFF; text-decoration: none;">用户协议</a>和<a href="#" style="color: #165DFF; text-decoration: none;">隐私政策</a>
                    </label>
                </div>

                <button class="submit-btn" id="register-submit">注册</button>

                <div class="divider">
                    <span>或使用以下方式注册</span>
                </div>

                <div class="social-login">
                    <div class="social-btn wechat">
                        <span>微</span>
                    </div>
                    <div class="social-btn qq">
                        <span>Q</span>
                    </div>
                    <div class="social-btn weibo">
                        <span>微</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入外部JavaScript文件 -->
    <script src="script.js"></script>
</body>
</html>
